<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Creaters — Community Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e1f;
    --bg-panel: #12172e;
    --ink: #f4f2ff;
    --muted: #8b8db8;
    --gold: #ffc145;
    --whatsapp: #2fd66d;
    --youtube: #ff4444;
    --discord: #6f7bff;
    --line: rgba(244,242,255,0.09);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .kolam-field{
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(rgba(255,193,69,0.16) 1px, transparent 1.4px);
    background-size: 28px 28px;
    pointer-events: none;
  }
  .glow{
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
  }
  .glow-1{ width: 480px; height: 480px; top: -180px; right: -140px; background: radial-gradient(circle, rgba(111,123,255,0.35), transparent 70%); }
  .glow-2{ width: 420px; height: 420px; bottom: -160px; left: -120px; background: radial-gradient(circle, rgba(47,214,109,0.18), transparent 70%); }

  main{ position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 24px 96px; min-height: 100vh; }

  .page{ display: none; }
  .page.active{ display: block; }

  /* ---- home ---- */
  header.hero{
    padding: 88px 0 48px;
    position: relative;
  }
  .kolam-motif{
    position: absolute;
    top: 24px;
    right: 0;
    width: 96px;
    height: 96px;
    opacity: 0.55;
  }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .eyebrow::before{
    content: "";
    width: 22px; height: 1px;
    background: var(--gold);
    display: inline-block;
  }
  h1{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: clamp(44px, 8vw, 84px);
    line-height: 0.98;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 span{ color: var(--gold); }
  .tagline{
    margin: 22px 0 0;
    max-width: 46ch;
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* ---- category buttons (home) ---- */
  .cat-buttons{
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 44px;
  }
  .cat-btn{
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 22px;
    text-align: left;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .cat-btn:hover, .cat-btn:focus-visible{
    transform: translateY(-2px);
    background: #171d38;
    outline: none;
  }
  .cat-btn:focus-visible{ box-shadow: 0 0 0 2px var(--gold); }
  .cat-btn .icon{
    font-size: 28px;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    flex-shrink: 0;
  }
  .cat-btn .icon svg{ display: block; }
  .cat-btn .text{ flex: 1; min-width: 0; }
  .cat-btn .name{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0 0 3px;
  }
  .cat-btn .count{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .cat-btn .arrow{
    font-size: 20px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.18s ease, color 0.18s ease;
  }
  .cat-btn:hover .arrow{ transform: translateX(3px); color: var(--ink); }

  [data-page="whatsapp"] .icon, .cat-btn.whatsapp .icon{ color: var(--whatsapp); }
  .cat-btn.youtube .icon{ color: var(--youtube); }
  .cat-btn.discord .icon{ color: var(--discord); }
  .cat-btn.whatsapp:hover{ border-color: var(--whatsapp); }
  .cat-btn.youtube:hover{ border-color: var(--youtube); }
  .cat-btn.discord:hover{ border-color: var(--discord); }
  .cat-btn.projects:hover{ border-color: var(--gold); }

  /* ---- inner pages ---- */
  .page-header{
    padding: 48px 0 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-btn{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .back-btn:hover, .back-btn:focus-visible{ background: #171d38; outline: none; }
  .back-btn:focus-visible{ box-shadow: 0 0 0 2px var(--gold); }
  .page-title{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .page-title .icon{ display: flex; align-items: center; }
  .page-title .icon svg{ display: block; }

  .channel-buttons{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .channel-btn{
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px;
    text-align: left;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .channel-btn:hover, .channel-btn:focus-visible{
    transform: translateY(-2px);
    background: #171d38;
    outline: none;
  }
  .channel-btn:focus-visible{ box-shadow: 0 0 0 2px var(--gold); }
  .channel-btn .emoji{
    font-size: 21px;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    flex-shrink: 0;
  }
  .channel-btn .name{
    font-weight: 700;
    font-size: 15px;
    flex: 1;
  }
  .channel-btn .go{
    font-size: 16px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.18s ease, color 0.18s ease;
  }
  .channel-btn:hover .go{ transform: translateX(3px); color: var(--ink); }

  [data-page="whatsapp"] .channel-btn:hover{ border-color: var(--whatsapp); }
  [data-page="youtube"] .channel-btn:hover{ border-color: var(--youtube); }
  [data-page="discord"] .channel-btn:hover{ border-color: var(--discord); }
  [data-page="projects"] .channel-btn:hover{ border-color: var(--gold); }
  [data-page="whatsapp"] .page-title .icon{ color: var(--whatsapp); }
  [data-page="youtube"] .page-title .icon{ color: var(--youtube); }
  [data-page="discord"] .page-title .icon{ color: var(--discord); }
  [data-page="projects"] .page-title .icon{ color: var(--gold); }

  footer{
    margin-top: 64px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    .cat-btn, .channel-btn, .back-btn{ transition: none; }
    html{ scroll-behavior: auto; }
  }

  @media (max-width: 560px){
    header.hero{ padding: 56px 0 32px; }
    .kolam-motif{ width: 64px; height: 64px; top: 4px; }
    .page-header{ padding: 32px 0 24px; }
  }
</style>
</head>

      <button class="cat-btn projects" data-goto="projects">

    </div>

    <footer>

  </section>

</main>

<script>
  var pages = document.querySelectorAll('.page');

  function showPage(name){
    pages.forEach(function(p){
      p.classList.toggle('active', p.getAttribute('data-page') === name);
    });
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('[data-goto]').forEach(function(btn){
    btn.addEventListener('click', function(){
      showPage(btn.getAttribute('data-goto'));
    });
  });

  document.querySelectorAll('.channel-btn[data-link]').forEach(function(btn){
    btn.addEventListener('click', function(){
      window.open(btn.getAttribute('data-link'), '_blank', 'noopener');
    });
  });
</script>

</body>
</html>
